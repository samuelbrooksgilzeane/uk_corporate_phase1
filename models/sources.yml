version: 2

sources:
  - name: companies_house
    description: "Bronze tables written by the Companies House stream capture job and the PSC bulk snapshot loader."
    database: "{{ var('bronze_catalog', 'uk_corporate') }}"
    schema: "{{ var('bronze_schema', 'bronze') }}"
    tables:
      - name: psc_bulk_snapshots
        description: "Daily full PSC snapshot records, partitioned by snapshot date and source archive part."
      - name: psc_bulk_manifest
        description: "Snapshot load completeness; downstream models exclude incomplete dates."
      - name: ch_stream_events
        description: "Append-only raw events from the nine public Companies House streaming endpoints."
      - name: ch_stream_checkpoints
        description: "Last durably committed offset per source stream."

