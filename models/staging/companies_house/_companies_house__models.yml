version: 2

models:
  - name: stg_ch_stream_events
    description: >
      Raw events from all nine Companies House streams, deduplicated so each
      stream_name and event_timepoint appears once. It keeps every version of
      every resource, including deletions, so this is the full change history.
      int_ch_latest_records builds the current state from it, and the PSC
      history models read it directly.
    columns:
      - name: event_id
        data_tests: [not_null, unique]
      - name: stream_name
        data_tests: [not_null]
      - name: event_timepoint
        data_tests: [not_null]

  - name: stg_ch_companies
    description: >
      Current company profiles from the companies stream, with name, status,
      type, key dates, registered postcode and SIC codes. Feeds dim_ch_companies
      and mart_ch_company_activity.

  - name: stg_ch_officer_appointments
    description: >
      Current officer appointments from the officers stream, one row per
      appointment. These make up the officer side of bridge_ch_company_parties.
      officer_id is a Companies House record ID rather than a verified person,
      so don't use it or the name to match people across companies.

  - name: stg_ch_charges
    description: >
      Registered charges (mortgages, debentures and other security) from the
      charges stream, one row per charge. Used for the charge counts in
      mart_ch_company_activity.

  - name: stg_ch_filings
    description: >
      Filing history items from the filings stream, one row per filing. It only
      has filings published since capture started, not a company's full
      history. Used for the filing counts in mart_ch_company_activity.

  - name: stg_ch_insolvency
    description: >
      Current insolvency record for each company from the insolvency stream,
      with the cases left as a JSON array. fct_ch_insolvency_cases splits these
      out into one row per case.

  - name: stg_ch_disqualifications
    description: >
      Disqualified officer records from the disqualifications stream. These are
      people rather than companies, and nothing downstream uses them yet. Only
      link them to officers through a verified identifier, never by name.

  - name: stg_ch_exemptions
    description: >
      Companies exempt from keeping a PSC register, from the exemptions stream.
      Nothing downstream uses it yet, but it explains why some companies report
      no PSCs.

  - name: stg_ch_psc_statements
    description: >
      Current PSC statements from the psc_statements stream, which a company
      files when it has no PSC or can't identify one. Nothing downstream uses
      it yet.

  - name: stg_ch_psc_stream
    description: >
      Every PSC change event from the psc stream, read from stg_ch_stream_events
      so earlier versions are kept. It stays separate from the bulk PSC history
      until the snapshot and stream cutover has been checked.

  - name: stg_psc_bulk
    description: >
      PSC records from the daily bulk snapshot, one row per PSC per snapshot
      date. Only dates the manifest marks as complete are included, so a
      half-loaded snapshot can't look like PSCs disappearing. Feeds
      int_psc_daily_deltas and the baseline for dim_psc_history_verified.
    columns:
      - name: psc_id
        data_tests: [not_null]
      - name: company_number
        data_tests: [not_null]
